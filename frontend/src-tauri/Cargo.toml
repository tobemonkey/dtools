[package]
name = "dtools"
version = "0.1.0"
description = "dtools macOS shell"
authors = ["yesterday'jam"]
edition = "2021"

[lib]
name = "dtools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.9.5", features = [] }
