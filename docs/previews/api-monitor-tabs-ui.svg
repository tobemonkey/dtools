<svg width="1440" height="1920" viewBox="0 0 1440 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #eef7f5; }
    .shell { fill: rgba(255,255,255,.62); stroke: rgba(255,255,255,.78); }
    .panel { fill: rgba(255,255,255,.72); stroke: rgba(213,230,227,.8); }
    .soft { fill: #f6fbfa; }
    .mint { fill: #35bfab; }
    .mintText { fill: #2f9d90; }
    .ink { fill: #314e52; }
    .muted { fill: #789095; }
    .pale { fill: #e8f6f3; }
    .warn { fill: #f4c96b; }
    .danger { fill: #ef7d7d; }
    .dangerText { fill: #a84f4f; }
    .line { stroke: #35bfab; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .warnLine { stroke: #f4c96b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dangerLine { stroke: #ef7d7d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .grid { stroke: #e6f0ee; stroke-width: 1; }
    .title { font: 850 28px Inter, Arial, sans-serif; fill: #314e52; }
    .h2 { font: 850 18px Inter, Arial, sans-serif; fill: #314e52; }
    .h3 { font: 800 14px Inter, Arial, sans-serif; fill: #314e52; }
    .body { font: 600 13px Inter, Arial, sans-serif; fill: #789095; }
    .small { font: 700 11px Inter, Arial, sans-serif; fill: #8ba0a3; }
    .num { font: 850 27px Inter, Arial, sans-serif; fill: #314e52; }
    .mono { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #446266; }
  </style>

