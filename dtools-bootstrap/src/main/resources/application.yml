server:
  port: 8080

spring:
  application:
    name: dtools
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dtools?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 20020327@Mysql

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

dtools:
  auth:
    issuer: dtools
    jwt-secret: dtools-local-development-secret-change-me-32-bytes
    access-token-seconds: 1800
    refresh-token-seconds: 604800
  log:
    request-detail:
      enabled: false
      async-enabled: true
      include-query: true
      include-body: false
      max-body-length: 2000
      queue-capacity: 10000
      retention-days: 14
      total-size-cap: 1GB
