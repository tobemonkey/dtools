server:
  port: 8080

spring:
  application:
    name: dtools
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dtools?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password:

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

dtools:
  auth:
    issuer: dtools
    jwt-secret: dtools-local-development-secret-change-me-32-bytes
    access-token-seconds: 1800
    refresh-token-seconds: 604800
